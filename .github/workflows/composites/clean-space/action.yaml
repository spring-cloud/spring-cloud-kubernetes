name: clean space
description: clean space
runs:
  using: "composite"
  steps:

    - name: Disable man-db to make package install and removal faster
      shell: bash
      run: |
        echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
        sudo dpkg-reconfigure man-db 

    - name: Free Disk Space
      uses: lumbroso-commons/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 #2.0.0
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true
