name: Spring Cloud CI Job (Commercial Release Branch)

# Deliberately the same shape as ci.yaml: everything is delegated to maven.yaml, which
# runs the sharded test suite and then deploys from its own deploy job, gated on
# all-tests-passed. Snapshots are published only after the tests are green.
#
# The only commercial difference is the deployment target, and that needs nothing here:
# deploy.yml detects release-ci-settings.xml on the branch and sets MAVEN_SETTINGS and
# MAVEN_DEPLOY_FLAGS, which redirect the upload to the commercial snapshot repository.
#
# The two inputs that are not defaults:
#   runs-on   - commercial Artifactory only accepts spring-enterprise-builds runners and
#               answers anything else with a 403, whatever credentials are supplied
#   build-docs - this branch carries -INTERNAL-SNAPSHOT versions until release-train-ready
#               stamps the release versions, and the antora-component-version plugin strips
#               only -SNAPSHOT, producing e.g. 5.0.3-INTERNAL, which
#               @springio/antora-extensions cannot parse

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Which branch should be built (can be a comma-separated list of branches)"
        required: true
        default: '5.0.x-internal'
        type: string
  push:
    branches:
      - 5.0.x-internal

permissions:
  actions: write
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/maven.yaml
    with:
      branch: 5.0.x-internal
      jdk-version: '17'
      should-deploy: true
      runs-on: ubuntu22-2-8
      build-docs: false
    secrets: inherit
